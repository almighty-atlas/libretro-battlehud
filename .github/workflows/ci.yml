name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configure native Apple Silicon build
        run: >-
          cmake -S . -B build-macos
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build macOS proxy
        run: cmake --build build-macos --parallel 3

      - name: Test macOS proxy
        run: ctest --test-dir build-macos --output-on-failure

      - name: Verify native arm64 library
        run: lipo build-macos/pokemon_gambatte_libretro.dylib -verify_arch arm64

      - name: Check out real Gambatte for macOS integration testing
        uses: actions/checkout@v4
        with:
          repository: libretro/gambatte-libretro
          ref: d9d6cd06382d1ced30de34d56d3609452323dab1
          path: build-macos/gambatte-source

      - name: Build native macOS Gambatte
        run: make -C build-macos/gambatte-source -j3 platform=osx CC=clang CXX=clang++ ARCHFLAGS="-arch arm64"

      - name: Compare direct macOS Gambatte and proxy
        run: >-
          python3 tests/gambatte_integration.py
          build-macos/pokemon_gambatte_libretro.dylib
          build-macos/gambatte-source/gambatte_libretro.dylib

      - name: Verify M1 marker with real macOS Gambatte
        run: >-
          python3 tests/gambatte_integration.py
          build-macos/pokemon_gambatte_libretro.dylib
          build-macos/gambatte-source/gambatte_libretro.dylib --marker

      - name: Upload macOS test build
        uses: actions/upload-artifact@v4
        with:
          name: battlehud-macos-arm64-icons-moves
          path: build-macos/pokemon_gambatte_libretro.dylib
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check out real Gambatte for integration testing
        uses: actions/checkout@v4
        with:
          repository: libretro/gambatte-libretro
          ref: d9d6cd06382d1ced30de34d56d3609452323dab1
          path: build/gambatte-source

      - name: Build real Gambatte
        run: make -C build/gambatte-source -j2 platform=unix

      - name: Compare direct Gambatte and proxy using original test ROM
        run: >-
          python3 tests/gambatte_integration.py
          build/pokemon_gambatte_libretro.so
          build/gambatte-source/gambatte_libretro.so

      - name: Verify M1 marker with real Gambatte
        run: >-
          python3 tests/gambatte_integration.py
          build/pokemon_gambatte_libretro.so
          build/gambatte-source/gambatte_libretro.so --marker

  h700:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/loveretro/h700-toolchain:latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure with NextUI H700 toolchain
        run: >-
          cmake -S . -B build-h700
          -DCMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN_FILE"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS=-mcpu=cortex-a53
          -DBUILD_TESTING=OFF

      - name: Build H700 proxy
        run: cmake --build build-h700 --parallel 2

      - name: Verify 64-bit AArch64 shared library
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          data = Path('build-h700/pokemon_gambatte_libretro.so').read_bytes()
          assert data[:6] == b'\x7fELF\x02\x01', 'Expected ELF64 little-endian'
          assert struct.unpack_from('<HH', data, 16) == (3, 183), 'Expected AArch64 shared object'
          PY

      - name: Upload H700 test build
        uses: actions/upload-artifact@v4
        with:
          name: battlehud-h700-icons-moves
          path: build-h700/pokemon_gambatte_libretro.so
          if-no-files-found: error

      - name: Build isolated NextUI H700 test Pak
        run: >-
          python3 scripts/package_nextui.py
          --core build-h700/pokemon_gambatte_libretro.so
          --output build-h700/package/battlehud-nextui-h700.zip
          --commit "$GITHUB_SHA"

      - name: Upload NextUI H700 test Pak
        uses: actions/upload-artifact@v4
        with:
          name: battlehud-nextui-h700-pak
          path: build-h700/package/
          if-no-files-found: error
